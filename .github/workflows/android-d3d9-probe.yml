name: Android DXVK D3D9 smoke test

on:
  push:
    branches:
      - audit/android-arm64-next-steps
    paths:
      - "android-d3d9-probe/**"
      - ".github/workflows/android-d3d9-probe.yml"
  pull_request:
    paths:
      - "android-d3d9-probe/**"
      - ".github/workflows/android-d3d9-probe.yml"
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools cmake python3-pip
          python3 -m pip install --user --break-system-packages meson==1.5.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build SDL2 for Android ARM64
        run: |
          SDL_DIR="$RUNNER_TEMP/SDL"
          mkdir -p "$SDL_DIR"
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git "$SDL_DIR"
          cmake -S "$SDL_DIR" -B "$SDL_DIR/build-android" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build "$SDL_DIR/build-android"
          SDL_LIB="$(find "$SDL_DIR/build-android" -name libSDL2.so -print -quit)"
          test -n "$SDL_LIB"
          echo "SDL_LIB=$SDL_LIB" >> "$GITHUB_ENV"
          echo "SDL_ROOT=$SDL_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned Android DXVK Native fork
        run: |
          DXVK_DIR="$RUNNER_TEMP/dxvk-native-android"
          git clone https://github.com/Star1xr/dxvk-native-android.git "$DXVK_DIR"
          git -C "$DXVK_DIR" checkout f2c7207b3d8bc848fe3a27cef34ee5e67aeec552
          # Use the same shared libc++ runtime as SDL2 and the app's JNI library.
          # The fork's default script forces a separate static libc++ into DXVK.
          sed -i "s/'-static-libstdc++', //g" "$DXVK_DIR/android/build-android.sh"
          ! grep -q -- "-static-libstdc++" "$DXVK_DIR/android/build-android.sh"
          echo "DXVK_ROOT=$DXVK_DIR" >> "$GITHUB_ENV"

      - name: Fetch pinned pcrecomp headers for host bridge compile check
        run: |
          PCRECOMP_DIR="$RUNNER_TEMP/pcrecomp"
          git clone https://github.com/sp00nznet/pcrecomp.git "$PCRECOMP_DIR"
          git -C "$PCRECOMP_DIR" checkout 7c07a0b42059b6dc4313d9b4ebded6f7a72db8f3
          echo "PCRECOMP_ROOT=$PCRECOMP_DIR" >> "$GITHUB_ENV"

      - name: Build DXVK Native D3D9 for Android ARM64
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export SDL2_INCLUDE="$SDL_ROOT/include"
          export SDL2_LIB_DIR="$(dirname "$SDL_LIB")"
          "$DXVK_ROOT/android/build-android.sh" arm64-v8a 24 "$RUNNER_TEMP/dxvk-build"
          mkdir -p android-d3d9-probe/app/src/main/jniLibs/arm64-v8a
          cp "$SDL_LIB" android-d3d9-probe/app/src/main/jniLibs/arm64-v8a/libSDL2.so
          cp "$RUNNER_TEMP/dxvk-build/arm64-v8a/lib/libdxvk_d3d9.so" android-d3d9-probe/app/src/main/jniLibs/arm64-v8a/
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            android-d3d9-probe/app/src/main/jniLibs/arm64-v8a/
          mkdir -p android-d3d9-probe/app/src/main/assets/third_party
          cp "$DXVK_ROOT/LICENSE" android-d3d9-probe/app/src/main/assets/third_party/DXVK-LICENSE.txt
          cp "$SDL_ROOT/LICENSE.txt" android-d3d9-probe/app/src/main/assets/third_party/SDL2-LICENSE.txt

      - name: Build Android D3D9 test APK
        run: |
          gradle --no-daemon -p android-d3d9-probe \
            -PsdlRoot="$SDL_ROOT" -PdxvkRoot="$DXVK_ROOT" -PpcrecompRoot="$PCRECOMP_ROOT" :app:assembleDebug

      - name: Verify shared C++ runtime and APK contents
        run: |
          NDK_BIN="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          READELF="$NDK_BIN/llvm-readelf"
          APK="android-d3d9-probe/app/build/outputs/apk/debug/app-debug.apk"
          APK_LIBDIR="$RUNNER_TEMP/apk-libs/lib/arm64-v8a"
          mkdir -p "$RUNNER_TEMP/apk-libs"
          unzip -q "$APK" "lib/arm64-v8a/*.so" -d "$RUNNER_TEMP/apk-libs"
          for LIB in libSDL2.so libmain.so libdxvk_d3d9.so; do
            echo "Checking shared runtime dependency: $LIB"
            "$READELF" -d "$APK_LIBDIR/$LIB" | grep -q "NEEDED.*libc++_shared.so"
          done
          "$READELF" -h "$APK_LIBDIR/libdxvk_d3d9.so" | grep -q AArch64
          "$NDK_BIN/llvm-nm" -D "$APK_LIBDIR/libdxvk_d3d9.so" | grep -q Direct3DCreate9
          unzip -l "$APK" | grep "lib/arm64-v8a/libSDL2.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libmain.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libdxvk_d3d9.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libc++_shared.so"
          unzip -l "$APK" | grep "assets/third_party/DXVK-LICENSE.txt"
          unzip -l "$APK" | grep "assets/third_party/SDL2-LICENSE.txt"
          test -n "$(find android-d3d9-probe/app/.cxx -name 'tm_d3d9_dxvk.cpp.o' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: the-movies-dxvk-d3d9-probe-arm64
          path: android-d3d9-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
