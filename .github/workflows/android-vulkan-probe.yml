name: Android Vulkan probe

on:
  push:
    branches:
      - audit/android-arm64-next-steps
    paths:
      - "android-probe/**"
      - ".github/workflows/android-vulkan-probe.yml"
  pull_request:
    paths:
      - "android-probe/**"
      - ".github/workflows/android-vulkan-probe.yml"
  workflow_dispatch:

jobs:
  build-arm64-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build arm64 APK
        run: gradle --no-daemon -p android-probe :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: the-movies-vulkan-probe-arm64-debug
          path: android-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
