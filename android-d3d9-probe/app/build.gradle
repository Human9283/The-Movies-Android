plugins {
    id "com.android.application"
}

def sdlRoot = project.findProperty("sdlRoot") ?: ""
def dxvkRoot = project.findProperty("dxvkRoot") ?: ""
def pcrecompRoot = project.findProperty("pcrecompRoot") ?: ""
if (sdlRoot.toString().isEmpty() || dxvkRoot.toString().isEmpty() || pcrecompRoot.toString().isEmpty()) {
    throw new GradleException("Pass -PsdlRoot, -PdxvkRoot and -PcrecompRoot from the Android build workflow")
}

android {
    namespace "com.human9283.d3d9probe"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.human9283.d3d9probe"
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName "0.8.0"
        ndk { abiFilters "arm64-v8a" }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // SDL2, this JNI library and the lazily loaded DXVK library
                // must all use the same shared libc++ runtime.
                arguments "-DANDROID_STL=c++_shared",
                          "-DDXVK_SOURCE_DIR=" + dxvkRoot,
                          "-DSDL2_INCLUDE_DIR=" + sdlRoot + "/include",
                          "-DSDL2_LIB_DIR=" + projectDir + "/src/main/jniLibs/arm64-v8a",
                          "-DPCRECOMP_SOURCE_DIR=" + pcrecompRoot
            }
        }
    }

    sourceSets {
        main {
            java.srcDir(sdlRoot + "/android-project/app/src/main/java")
            res.srcDir(sdlRoot + "/android-project/app/src/main/res")
            jniLibs.srcDir "src/main/jniLibs"
        }
    }

    externalNativeBuild {
        cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" }
    }
}
